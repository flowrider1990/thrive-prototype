name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, and let a running one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Deliberately unpinned: action-setup reads `packageManager` from
      # package.json, so CI can never drift from the local pnpm version.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Repository **variables**, not secrets, and that is the point: the static
          # export inlines every NEXT_PUBLIC_* value straight into the JavaScript it
          # ships, so both of these are printed on the page whatever we call them here.
          # Marking a value secret that is then published teaches the wrong lesson about
          # which values are which. The publishable key grants nothing without a session,
          # and RLS is what bounds it -- see docs/supabase-migration.md section 18.
          #
          # It is `PUBLISHABLE_KEY`, not the legacy `ANON_KEY`: the project has four keys
          # and only the `sb_publishable_...` one is meant for a browser.
          # scripts/check-supabase.mjs fails on a legacy JWT rather than silently
          # accepting it.
          #
          # Leaving them unset is a valid build, not a broken one: the app then has no
          # cloud to sync with, says so under Data protection, and offers no sign-in.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      # The artifact flow does not run Jekyll, so no .nojekyll file is needed.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
